<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2f4">
<link rel="manifest" href="manifest.webmanifest">
<title>Мой ритм</title>
<style>
:root{--pink:#e7a4b8;--green:#2f6f61;--bg:#f7f5f4;--text:#262526;--muted:#8d898b;--card:#fff;--line:#eee8ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 96px}
h1{font-size:25px;margin:5px 0 14px;text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;align-items:center;justify-content:space-between}
.iconbtn{border:0;background:transparent;font-size:22px;padding:7px}
.dates{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:8px 0 18px;touch-action:pan-y}
.date{width:45px;height:60px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .22s ease,background .28s ease,color .28s ease}
.date .dow{font-size:11px;color:var(--muted)}.date .num{font-size:17px;font-weight:600}
.date.active{background:var(--accent);color:white;transform:scale(1.04)}.date.active .dow{color:rgba(255,255,255,.8)}
.progress{border-radius:26px;padding:22px;color:white;min-height:158px;margin-bottom:20px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.progress:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.10)}
.progress>*{position:relative}.progress .pct{font-size:38px;font-weight:700}.progress .label{font-size:15px;opacity:.92}
.tasklib{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile,.daytask{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.tile:active,.daytask:active{transform:scale(.98)}.tile .ico{font-size:23px}.tile .name{font-size:14px;font-weight:600}
h2{font-size:17px;margin:18px 0 10px}.daytask{margin:8px 0;justify-content:space-between}.left{display:flex;gap:10px;align-items:center}.check{width:23px;height:23px;border:2px solid #d8d2d5;border-radius:50%;display:grid;place-items:center;color:white;font-size:13px}.done .check{background:var(--accent);border-color:var(--accent)}.done .name{text-decoration:line-through;color:var(--muted)}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(488px,calc(100% - 24px));background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:25px;padding:8px;display:flex;justify-content:space-around;z-index:10}.nav button{border:0;background:transparent;padding:9px 17px;color:var(--muted);font-size:12px}.nav .sel{color:var(--text);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;z-index:20}.sheet{background:var(--bg);width:100%;max-height:84vh;border-radius:28px 28px 0 0;padding:18px;overflow:auto}.sheet h3{margin:5px 0 15px}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px;text-align:left}.opt.selected{border-color:var(--accent)}.bgthumb{height:70px;border-radius:13px;margin-bottom:8px;background-size:cover;background-position:center}
.dark{--bg:#171719;--text:#f4f1f2;--card:#242426;--line:#353438}.dark .nav{background:rgba(35,35,38,.92)}
@media(max-width:360px){.date{width:40px}.tasklib{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tasks=[
["breakfast","Завтрак","🍳"],["lunch","Обед","🥗"],["dinner","Ужин","🍽️"],["study","Учёба","📚"],
["strength","Силовая","🏋️"],["cardio","Кардио","🏃"],["vacuum","Пылесос","🧹"],["laundry","Стирка","🧺"],
["dryer","Разобрать сушилку","🧦"],["leo","Играть с Лео","🧸"],["readleo","Читать Лео","📖"],["mom","Позвонить маме","📞"],
["bath","Ванна с кремом","🛁"],["cook","Готовка","🍳"]
];
const photos={
mist:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85",
forest:"https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=85",
sea:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=85",
night:"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=85"
};
let state=JSON.parse(localStorage.getItem("ritm7")||"null")||{date:new Date().toISOString().slice(0,10),plans:{},accent:"green",theme:"day",bg:"mist"};
const save=()=>localStorage.setItem("ritm7",JSON.stringify(state));
const pad=n=>String(n).padStart(2,"0");
function key(d){return d.toISOString().slice(0,10)}
function dateFrom(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(s){let d=dateFrom(s);return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}
function datesAround(){
 let d=dateFrom(state.date), out=[];
 for(let i=-3;i<=3;i++){let x=new Date(d);x.setDate(d.getDate()+i);out.push(x)}
 return out
}
function render(){
 document.documentElement.style.setProperty("--accent",state.accent==="pink"?"var(--pink)":"var(--green)");
 document.body.className=state.theme==="night"?"dark":"";
 let planned=state.plans[state.date]||[], done=planned.filter(x=>x.done).length;
 let pct=planned.length?Math.round(done/planned.length*100):0;
 let ds=datesAround();
 document.getElementById("app").innerHTML=`
 <div class="app">
  <div class="top"><h1>${dateFrom(state.date).toLocaleDateString("ru-RU",{month:"long"})}</h1><button class="iconbtn" onclick="settings()">⚙︎</button></div>
  <div class="dates" id="dates">${ds.map(d=>`<div class="date ${key(d)===state.date?"active":""}" data-date="${key(d)}"><span class="dow">${d.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span><span class="num">${d.getDate()}</span></div>`).join("")}</div>
  <div class="progress" style="background-image:url('${photos[state.bg]}')"><div class="pct">${pct}%</div><div class="label">${done} из ${planned.length} задач выполнено</div></div>
  <h2>Добавить в ${fmt(state.date)}</h2>
  <div class="tasklib">${tasks.map(t=>`<div class="tile" onclick="addTask('${t[0]}')"><span class="ico">${t[2]}</span><span class="name">${t[1]}</span></div>`).join("")}</div>
  <h2>В плане на день</h2>
  ${planned.length?planned.map((p,i)=>`<div class="daytask ${p.done?"done":""}" onclick="toggle(${i})"><div class="left"><span class="ico">${p.ico}</span><span class="name">${p.name}</span></div><span class="check">${p.done?"✓":""}</span></div>`).join(""):`<div style="color:var(--muted);padding:8px 2px">Пока ничего не добавлено</div>`}
 </div>
 <div class="nav"><button class="sel">День</button><button onclick="month()">Месяц</button><button onclick="settings()">Настройки</button></div>
 <div class="modal" id="modal"></div>`;
 attachSwipe();
}
function addTask(id){let t=tasks.find(x=>x[0]===id);let a=state.plans[state.date]||[];if(!a.some(x=>x.id===id)){a.push({id,name:t[1],ico:t[2],done:false});state.plans[state.date]=a;save();render()}}
function toggle(i){state.plans[state.date][i].done=!state.plans[state.date][i].done;save();render()}
function shift(n){let d=dateFrom(state.date);d.setDate(d.getDate()+n);state.date=key(d);save();render()}
function attachSwipe(){
 const el=document.getElementById("dates");let x=0,y=0;
 el.addEventListener("touchstart",e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
 el.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){shift(dx<0?1:-1)}},{passive:true});
 document.querySelectorAll(".date").forEach(e=>e.onclick=()=>{state.date=e.dataset.date;save();render()});
}
function month(){
 let d=dateFrom(state.date),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate();
 let rows="";for(let n=1;n<=days;n++){let s=`${y}-${pad(m+1)}-${pad(n)}`,a=state.plans[s]||[];rows+=`<button class="opt" onclick="pick('${s}')"><b>${n}</b> · ${a.length} задач</button>`}
 document.getElementById("modal").innerHTML=`<div class="sheet"><button class="close" onclick="closeM()">×</button><h3>${d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</h3><div class="opts">${rows}</div></div>`;document.getElementById("modal").style.display="flex";
}
function pick(s){state.date=s;save();closeM();render()}
function settings(){
 document.getElementById("modal").innerHTML=`<div class="sheet"><button class="close" onclick="closeM()">×</button><h3>Настройки</h3>
 <p>Акцент</p><div class="opts"><button class="opt ${state.accent==="green"?"selected":""}" onclick="setAccent('green')">Изумрудный</button><button class="opt ${state.accent==="pink"?"selected":""}" onclick="setAccent('pink')">Розовый</button></div>
 <p>Тема</p><div class="opts"><button class="opt ${state.theme==="day"?"selected":""}" onclick="setTheme('day')">День</button><button class="opt ${state.theme==="night"?"selected":""}" onclick="setTheme('night')">Ночь</button></div>
 <p>Фон карточки</p><div class="opts">${Object.entries(photos).map(([k,v])=>`<button class="opt ${state.bg===k?"selected":""}" onclick="setBg('${k}')"><div class="bgthumb" style="background-image:url('${v}')"></div>${{mist:"Туманное утро",forest:"Тихий лес",sea:"Спокойное море",night:"Ночное небо"}[k]}</button>`).join("")}</div>
 </div>`;document.getElementById("modal").style.display="flex";
}
function closeM(){document.getElementById("modal").style.display="none"}
function setAccent(x){state.accent=x;save();settings();render()}
function setTheme(x){state.theme=x;save();settings();render()}
function setBg(x){state.bg=x;save();settings();render()}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=7");
</script>
</body></html>
