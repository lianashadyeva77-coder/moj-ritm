</style></head><body><div class="app"><header><div class="top"><div><div class="brand">Мой ритм</div><div class="sub">план на твоих условиях</div></div><div class="headicons"><button class="iconbtn" id="settings" aria-label="Настройки"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button></div></div><div class="week" id="week"></div></header><main><div class="mode"><button id="dayMode" class="active">День</button><button id="monthMode">Весь месяц</button></div><section class="hero"><div class="heroRow"><div><div class="heroTitle" id="heroDate"></div><div class="heroSmall" id="heroSub"></div></div><div class="pct" id="heroPct">0%</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="progressText" id="progressText"></div></section><div class="stats"><div class="stat"><b id="done">0</b><span>сделано</span></div><div class="stat"><b id="left">0</b><span>осталось</span></div><div class="stat"><b id="sport">0/3</b><span>спорт</span></div></div><div id="dayContent"></div><div class="monthView" id="monthContent"></div></main></div><button class="floating" id="add">＋ Добавить дело</button><nav class="bottom"><div class="bottomInner"><button class="tab active" id="tabDay"><svg class="tabIcon icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 9h16"/></svg>День</button><button class="tab" id="tabMonth"><svg class="tabIcon icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Месяц</button><button class="tab" id="tabAdd"><svg class="tabIcon icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Добавить</button></div></nav><div class="sheetBg" id="sheet"><div class="sheet"><div class="grab"></div><div class="sheetHead"><div><h2>Добавить в этот день</h2><div class="sheetIntro" id="sheetIntro"></div></div><button class="close" id="close">×</button></div><div class="sheetGrid" id="sheetGrid"></div></div></div><div class="sheetBg" id="settingsSheet"><div class="sheet"><div class="grab"></div><div class="sheetHead"><h2>Настройки</h2><button class="close" id="settingsClose">×</button></div><div class="sheetIntro">Выбери акцент приложения.</div><div class="settingsBox"><button class="accentBtn active" data-accent="green"><b>Изумрудный</b><span>спокойный iPhone-стиль</span></button><button class="accentBtn" data-accent="pink"><b>Розовый</b><span>мягкий акцент как у Flo</span></button></div></div></div>
<script>
const seed=[['breakfast','Завтрак','Каждый день','daily'],['study','Учёба · 2 часа','Учёба','weekdays'],['strength','Силовая тренировка','Спорт','weekly2'],['cardio','Кардио','Спорт','weekly1'],['home','Уборка дома','Дом','weekly1'],['fridge','Холодильник','Дом','biweekly'],['vacuum','Пылесос','Дом','weekly2'],['dishes','Посуда · утро + вечер','Дом','daily'],['dryer','Разобрать сушилку','Дом','daily'],['laundry','Стирка','Дом','weekly2'],['reading','Чтение · 1 час','Я','weekly3'],['cooking','Готовка','Дом','weekly2'],['lunch','Обед','Каждый день','daily'],['dinner','Ужин','Каждый день','daily'],['leo','Играть с Лео · 30 мин','Лео','daily'],['bedread','Читать перед сном · 10 мин','Лео','weekdays'],['toilet','Туалет · уборка','Дом','biweekly'],['kitchen','Кухня · уборка','Дом','biweekly'],['mom','Позвонить маме','Раз в неделю','weekly1'],['irade','Съездить к Ираде','Раз в месяц','monthly'],['massage','Массаж','Раз в месяц','monthly'],['bath','Ванна с кремом','Я','weekly1'],['series','Сериал','Я','manual']];
let tasks=JSON.parse(localStorage.getItem('rhythm_tasks')||'null')||seed.map(x=>({id:x[0],name:x[1],cat:x[2],freq:x[3]}));let checks=JSON.parse(localStorage.getItem('rhythm_checks')||'{}');let added=JSON.parse(localStorage.getItem('rhythm_added')||'{}');let accent=localStorage.getItem('rhythm_accent')||'green';let selected=new Date();let view=new Date(selected.getFullYear(),selected.getMonth(),1);let mode='day';const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];const dows=['вс','пн','вт','ср','чт','пт','сб'];
function save(){localStorage.setItem('rhythm_tasks',JSON.stringify(tasks));localStorage.setItem('rhythm_checks',JSON.stringify(checks));localStorage.setItem('rhythm_added',JSON.stringify(added));localStorage.setItem('rhythm_accent',accent)}function dayKey(d){return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}function key(d,id){return dayKey(d)+'_'+id}function planned(t,d){let w=d.getDay(),n=d.getDate();if(t.freq==='daily')return true;if(t.freq==='weekdays')return w>=1&&w<=5;if(t.freq==='weekly1')return w===1;if(t.freq==='weekly2')return [2,5].includes(w);if(t.freq==='weekly3')return [1,3,5].includes(w);if(t.freq==='weekly4')return [1,2,4,6].includes(w);if(t.freq==='biweekly')return n===1||n===15;if(t.freq==='monthly')return n===1||n===10;return false}function isToday(d){return dayKey(d)===dayKey(new Date())}function fmt(d){return `${d.getDate()} ${months[d.getMonth()].toLowerCase()} · ${dows[d.getDay()]}`}function iconSvg(cat){let p=cat==='Спорт'?'<path d="M7 4v16M17 4v16M4 7h16M4 17h16"/>':cat==='Дом'?'<path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/>':cat==='Учёба'?'<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h6"/>':cat==='Лео'?'<circle cx="12" cy="12" r="8"/><path d="M8 10h.01M16 10h.01M9 15c2 1 4 1 6 0"/>':'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2 4 4 0 017 2c0 5.5-7 10-7 10z"/>';return `<svg class="icon" viewBox="0 0 24 24">${p}</svg>`}
function isAdded(t,d){return !!added[dayKey(d)]?.includes(t.id)}function inDay(t,d){return planned(t,d)||isAdded(t,d)||!!checks[key(d,t.id)]}function dayTasks(d){return tasks.filter(t=>inDay(t,d))}function taskHtml(t,d,compact=false){let done=!!checks[key(d,t.id)],manual=isAdded(t,d),auto=planned(t,d);return `<div class="task"><div class="taskIcon">${iconSvg(t.cat)}</div><div class="taskInfo"><div class="taskName">${t.name}</div><div class="taskMeta">${auto?'по расписанию':manual?'добавлено на этот день':t.cat}</div></div>${manual&&!auto?`<button class="remove" data-remove="${t.id}" aria-label="Убрать">×</button>`:''}<button class="dot ${done?'done':''}" data-check="${key(d,t.id)}">${done?'✓':''}</button></div>`}
function renderWeek(){let start=new Date(selected);start.setDate(start.getDate()-((start.getDay()+6)%7));let h='<button class="weeknav" id="prev">‹</button>';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);h+=`<button class="date ${dayKey(d)===dayKey(selected)?'selected':''} ${isToday(d)?'today':''}" data-date="${dayKey(d)}"><div class="dow">${dows[d.getDay()]}</div><div class="num">${d.getDate()}</div></button>`}h+='<button class="weeknav" id="next">›</button>';document.getElementById('week').innerHTML=h;document.querySelectorAll('.date').forEach(b=>b.onclick=()=>{let [y,m,da]=b.dataset.date.split('-').map(Number);selected=new Date(y,m-1,da);view=new Date(y,m-1,1);mode='day';render()});document.getElementById('prev').onclick=()=>shiftWeek(-7);document.getElementById('next').onclick=()=>shiftWeek(7)}function shiftWeek(n){selected.setDate(selected.getDate()+n);view=new Date(selected.getFullYear(),selected.getMonth(),1);render()}
function render(){renderWeek();document.getElementById('dayMode').classList.toggle('active',mode==='day');document.getElementById('monthMode').classList.toggle('active',mode==='month');document.getElementById('tabDay').classList.toggle('active',mode==='day');document.getElementById('tabMonth').classList.toggle('active',mode==='month');let d=new Date(selected),all=dayTasks(d),done=all.filter(t=>checks[key(d,t.id)]).length;document.getElementById('heroDate').textContent=isToday(d)?'Сегодня':fmt(d);document.getElementById('heroSub').textContent=`${all.length} дел на этот день`;document.getElementById('heroPct').textContent=all.length?Math.round(done/all.length*100)+'%':'0%';document.getElementById('bar').style.width=(all.length?done/all.length*100:0)+'%';document.getElementById('progressText').textContent=all.length?`${done} из ${all.length} выполнено`:'Добавь дела, которые важны сегодня';document.getElementById('done').textContent=done;document.getElementById('left').textContent=all.length-done;let sport=all.filter(t=>t.cat==='Спорт'&&checks[key(d,t.id)]).length;document.getElementById('sport').textContent=`${sport}/3`;if(mode==='day'){document.getElementById('dayContent').style.display='block';document.getElementById('monthContent').style.display='none';renderDay(d,all)}else{document.getElementById('dayContent').style.display='none';document.getElementById('monthContent').style.display='block';renderMonth()}bind()}function renderDay(d,all){let groups=['Каждый день','Учёба','Спорт','Дом','Лео','Я','Раз в неделю','Раз в месяц'];let out='<div class="sectionHead"><h2>План на день</h2><small>'+fmt(d)+'</small></div>';for(let g of groups){let a=all.filter(t=>t.cat===g);if(a.length)out+=`<section class="card">${a.map(t=>taskHtml(t,d)).join('')}</section>`}out+='<div class="sectionHead"><h2>Можно добавить</h2><small>нажми — добавится</small></div><div class="catalog">';let available=tasks.filter(t=>!inDay(t,d));out+=available.map(t=>`<button class="pick" data-pick="${t.id}"><div class="pickIcon">${iconSvg(t.cat)}</div><div><b>${t.name}</b><span>${t.cat}</span></div></button>`).join('');out+='</div>';document.getElementById('dayContent').innerHTML=out||'<div class="empty">На этот день пока ничего нет.</div>'}function renderMonth(){let y=view.getFullYear(),m=view.getMonth(),N=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7,out='<div class="sectionHead"><h2>'+months[m]+' '+y+'</h2><small>выбери день</small></div><section class="card"><div class="monthGrid">';for(let i=0;i<first;i++)out+='<div></div>';for(let n=1;n<=N;n++){let d=new Date(y,m,n),a=dayTasks(d),done=a.filter(t=>checks[key(d,t.id)]).length;out+=`<button class="mday ${isToday(d)?'today':''} ${a.length?'has':''}" data-monthday="${n}"><b>${n}</b><div class="mini">${a.length?`${done}/${a.length} выполнено`:'свободно'}</div></button>`}out+='</div></section>';document.getElementById('monthContent').innerHTML=out;document.querySelectorAll('[data-monthday]').forEach(b=>b.onclick=()=>{selected=new Date(y,m,+b.dataset.monthday);mode='day';render()})}
function openAdd(){document.getElementById('sheetIntro').textContent=fmt(selected);let out='';tasks.forEach(t=>{let yes=inDay(t,selected);out+=`<button class="sheetTask ${yes?'added':''}" data-pick="${t.id}"><b>${yes?'✓ ':''}${t.name}</b><span>${t.cat}${planned(t,selected)?' · по расписанию':''}</span></button>`});document.getElementById('sheetGrid').innerHTML=out;document.getElementById('sheet').classList.add('open');document.querySelectorAll('#sheetGrid [data-pick]').forEach(b=>b.onclick=()=>{let id=b.dataset.pick;addToDay(id);openAdd()})}function addToDay(id){let dk=dayKey(selected);if(!added[dk])added[dk]=[];if(!added[dk].includes(id))added[dk].push(id);save();render()}function bind(){document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let k=b.dataset.check;checks[k]=!checks[k];if(!checks[k])delete checks[k];save();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let dk=dayKey(selected);added[dk]=(added[dk]||[]).filter(id=>id!==b.dataset.remove);if(!added[dk].length)delete added[dk];save();render()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{addToDay(b.dataset.pick)})}
document.getElementById('dayMode').onclick=()=>{mode='day';render()};document.getElementById('monthMode').onclick=()=>{mode='month';render()};document.getElementById('tabDay').onclick=()=>{mode='day';render()};document.getElementById('tabMonth').onclick=()=>{mode='month';render()};document.getElementById('tabAdd').onclick=openAdd;document.getElementById('add').onclick=openAdd;document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');document.getElementById('settings').onclick=()=>document.getElementById('settingsSheet').classList.add('open');document.getElementById('settingsClose').onclick=()=>document.getElementById('settingsSheet').classList.remove('open');document.querySelectorAll('.accentBtn').forEach(b=>b.onclick=()=>{accent=b.dataset.accent;if(accent==='pink'){document.documentElement.style.setProperty('--accent','#ee5f86');document.documentElement.style.setProperty('--accent2','#fde8ef')}else{document.documentElement.style.setProperty('--accent','#2f705b');document.documentElement.style.setProperty('--accent2','#e6f1ec')}document.querySelectorAll('.accentBtn').forEach(x=>x.classList.toggle('active',x===b));save()});if(accent==='pink'){document.documentElement.style.setProperty('--accent','#ee5f86');document.documentElement.style.setProperty('--accent2','#fde8ef')}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
