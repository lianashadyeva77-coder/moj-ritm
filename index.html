<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e96fa5">
<link rel="manifest" href="manifest.webmanifest">
<title>Мой ритм</title>
<style>
:root{--accent:#e96fa5;--accent2:#f6b6cf;--ink:#17171a;--muted:#8d8d96;--card:#fff;--bg:#f5f5f7;--line:#e7e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body.dark{--ink:#f5f5f7;--muted:#a8a8b2;--card:#1d1d20;--bg:#0e0e10;--line:#303036}
.app{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 100px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month{font-size:30px;font-weight:800;letter-spacing:-1.1px;text-transform:uppercase}
.gear{width:42px;height:42px;border:0;border-radius:14px;background:var(--card);box-shadow:0 3px 18px #00000010;font-size:20px}
.week{display:flex;gap:6px;overflow:hidden;padding:3px 0 12px;touch-action:pan-y}
.day{flex:1;min-width:43px;text-align:center;padding:8px 3px;border-radius:18px;background:transparent;border:0;color:var(--muted)}
.day .dow{font-size:11px;font-weight:600}.day .num{display:block;font-size:18px;font-weight:700;margin-top:4px}
.day.selected{background:var(--accent);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.hero{border-radius:26px;overflow:hidden;min-height:150px;padding:20px;color:white;position:relative;background-size:cover;background-position:center;box-shadow:0 12px 28px #00000018}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#0005,#0001 65%,#0004)}
.hero>*{position:relative;z-index:1}.hero .label{font-size:13px;font-weight:700;opacity:.9}.hero .percent{font-size:42px;font-weight:800;letter-spacing:-2px;margin-top:18px}.hero .sub{font-size:13px;opacity:.9}
.section-title{font-size:20px;font-weight:800;margin:24px 2px 10px}
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:15px;text-align:left;min-height:82px;box-shadow:0 4px 16px #0000000c;display:flex;align-items:center;gap:12px}
.task .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:22px}
.task .name{font-weight:750;font-size:14px;line-height:1.15}.task .meta{font-size:11px;color:var(--muted);margin-top:4px}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--card);border-radius:20px}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;display:flex;justify-content:space-around;padding:9px;box-shadow:0 10px 30px #0002;z-index:20}
.nav button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px 20px;border-radius:16px}.nav button.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:30}.sheet{background:var(--card);color:var(--ink);width:100%;max-width:620px;margin:auto;border-radius:28px 28px 0 0;padding:22px;max-height:86vh;overflow:auto}.modal.show{display:flex}
.close{float:right;border:0;background:var(--bg);border-radius:12px;width:36px;height:36px}
.setting-row{padding:15px 0;border-bottom:1px solid var(--line)}.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.choice{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 13px;border-radius:14px}.choice.active{border-color:var(--accent);color:var(--accent)}
.bgchoice{width:112px;height:70px;border-radius:15px;background-size:cover;background-position:center;border:2px solid transparent;color:white;text-shadow:0 1px 5px #000;font-weight:700}.bgchoice.active{border-color:var(--accent)}
.back{border:0;background:var(--bg);padding:10px 14px;border-radius:14px;font-weight:700;color:var(--ink)}
.detail-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.detail{display:flex;align-items:center;gap:12px;background:var(--card);padding:13px;border-radius:18px}.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:transparent}.detail.done .check{background:var(--accent);border-color:var(--accent);color:white}.detail.done .dn{text-decoration:line-through;color:var(--muted)}
@media(max-width:390px){.task-grid{grid-template-columns:1fr}.month{font-size:27px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="nav">
<button id="dayNav" class="active">◷ День</button>
<button id="monthNav">▦ Месяц</button>
<button id="settingsNav">⚙ Настройки</button>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const tasks=[
["breakfast","Завтрак","🍳","Утро"],["study","Учёба","📚","2 часа"],["strength","Силовая","💪","Тренировка"],["cardio","Кардио","🏃","Тренировка"],
["clean","Уборка","🧹","Дом"],["laundry","Стирка","🧺","Дом"],["leo","Лео","🧸","Вместе"],["reading","Чтение","📖","30 минут"],
["mom","Мама","📞","Связаться"],["cooking","Готовка","🍳","Дом"],["bath","Ванна","🛁","Вечер"],["walk","Прогулка","🌿","На улице"]
];
const bgs={
"mist":"linear-gradient(135deg,#71848d,#c7d1d1 48%,#56686d)",
"forest":"linear-gradient(135deg,#173d32,#5c8069 52%,#172a25)",
"sea":"linear-gradient(135deg,#2c6680,#7bbbc6 52%,#244b67)",
"night":"linear-gradient(135deg,#101a3a,#3e477e 52%,#0b1022)"
};
let state=JSON.parse(localStorage.getItem("ritm6")||"{}");
state.date=state.date||new Date().toISOString().slice(0,10);state.theme=state.theme||"light";state.accent=state.accent||"pink";state.bg=state.bg||"mist";state.days=state.days||{};
function save(){localStorage.setItem("ritm6",JSON.stringify(state))}
function dateObj(s){return new Date(s+"T12:00:00")}
function key(d){return d.toISOString().slice(0,10)}
function fmtMonth(d){return d.toLocaleDateString("ru-RU",{month:"long"}).replace(/^./,m=>m.toUpperCase())}
function daysOfMonth(d){let y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>new Date(y,m,i+1))}
function selectedWeek(){
 let d=dateObj(state.date), arr=[]; for(let i=-3;i<=3;i++){let x=new Date(d);x.setDate(d.getDate()+i);arr.push(x)} return arr;
}
function dayData(k){return state.days[k]||{added:[],done:[]}}
function pct(k){let x=dayData(k);return x.added.length?Math.round(x.done.filter(id=>x.added.includes(id)).length/x.added.length*100):0}
function addTask(id){let x=dayData(state.date);if(!x.added.includes(id)){x.added.push(id);state.days[state.date]=x;save();render()}}
function toggleDone(id){let x=dayData(state.date);x.done=x.done.includes(id)?x.done.filter(a=>a!==id):[...x.done,id];state.days[state.date]=x;save();render()}
function taskById(id){return tasks.find(t=>t[0]===id)}
function render(){
 document.body.classList.toggle("dark",state.theme==="dark");
 document.documentElement.style.setProperty("--accent",state.accent==="pink"?"#e96fa5":"#159b79");
 let d=dateObj(state.date), x=dayData(state.date), p=pct(state.date);
 let week=selectedWeek().map(q=>`<button class="day ${key(q)===state.date?"selected":""}" data-date="${key(q)}"><span class="dow">${q.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span><span class="num">${q.getDate()}</span></button>`).join("");
 let added=new Set(x.added);
 let available=tasks.filter(t=>!added.has(t[0]));
 document.getElementById("app").innerHTML=`
 <div class="top"><div class="month">${fmtMonth(d)}</div><button class="gear" id="gear">⚙︎</button></div>
 <div class="week" id="week">${week}</div>
 <div class="hero" style="background-image:${bgs[state.bg]}"><div class="label">ВЫПОЛНЕНО СЕГОДНЯ</div><div class="percent">${p}%</div><div class="sub">${x.done.filter(id=>added.has(id)).length} из ${x.added.length} дел</div></div>
 <div class="section-title">Добавить в ${d.getDate()} ${d.toLocaleDateString("ru-RU",{month:"long"})}</div>
 <div class="task-grid">${available.length?available.map(t=>`<button class="task" data-add="${t[0]}"><span class="ico">${t[2]}</span><span><div class="name">${t[1]}</div><div class="meta">${t[3]}</div></span></button>`).join(""):`<div class="empty" style="grid-column:1/-1">Все выбранные дела уже добавлены на этот день.</div>`}</div>
 <div class="section-title">В плане на день</div>
 <div class="detail-list">${x.added.length?x.added.map(id=>{let t=taskById(id),done=x.done.includes(id);return `<div class="detail ${done?"done":""}" data-toggle="${id}"><button class="check">${done?"✓":""}</button><span class="ico">${t[2]}</span><span class="dn">${t[1]}</span></div>`}).join(""):`<div class="empty">Пока ничего не добавлено. Нажми на любую плашку выше.</div>`}</div>`;
 document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{state.date=b.dataset.date;save();render()});
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addTask(b.dataset.add));
 document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleDone(b.dataset.toggle));
 document.getElementById("gear").onclick=openSettings;
 let startX=null;document.getElementById("week").ontouchstart=e=>startX=e.touches[0].clientX;
 document.getElementById("week").ontouchend=e=>{if(startX==null)return;let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>35){let q=dateObj(state.date);q.setDate(q.getDate()+(dx<0?1:-1));state.date=key(q);save();render()}startX=null};
}
function openSettings(){
 document.getElementById("sheet").innerHTML=`<button class="close" id="close">×</button><h2>Настройки</h2>
 <div class="setting-row"><b>Цвет</b><div class="choices"><button class="choice ${state.accent==="pink"?"active":""}" data-ac="pink">Розовый</button><button class="choice ${state.accent==="green"?"active":""}" data-ac="green">Изумрудный</button></div></div>
 <div class="setting-row"><b>Тема</b><div class="choices"><button class="choice ${state.theme==="light"?"active":""}" data-theme="light">Дневная</button><button class="choice ${state.theme==="dark"?"active":""}" data-theme="dark">Ночная</button></div></div>
 <div class="setting-row"><b>Фон карточки прогресса</b><div class="choices">
 ${Object.entries({mist:"Туманное утро",forest:"Тихий лес",sea:"Спокойное море",night:"Ночное небо"}).map(([k,v])=>`<button class="bgchoice ${state.bg===k?"active":""}" style="background-image:${bgs[k]}" data-bg="${k}">${v}</button>`).join("")}</div></div>`;
 document.getElementById("modal").classList.add("show");
 document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
 document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{state.accent=b.dataset.ac;save();openSettings();render()});
 document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();openSettings();render()});
 document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{state.bg=b.dataset.bg;save();openSettings();render()});
}
document.getElementById("monthNav").onclick=()=>{let d=dateObj(state.date);document.getElementById("sheet").innerHTML=`<button class="close" id="close">×</button><h2>${fmtMonth(d)}</h2><div class="detail-list">${daysOfMonth(d).map(q=>{let k=key(q);return `<button class="task" data-monthday="${k}"><span class="ico">${q.getDate()}</span><span><div class="name">${q.toLocaleDateString("ru-RU",{weekday:"long"})}</div><div class="meta">${dayData(k).added.length} дел · ${pct(k)}%</div></span></button>`}).join("")}</div>`;document.getElementById("modal").classList.add("show");document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");document.querySelectorAll("[data-monthday]").forEach(b=>b.onclick=()=>{state.date=b.dataset.monthday;save();document.getElementById("modal").classList.remove("show");render()})};
document.getElementById("settingsNav").onclick=openSettings;render();
</script>
</body></html>
